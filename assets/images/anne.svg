<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAnne" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0d11"/>
      <stop offset="60%" stop-color="#16131c"/>
      <stop offset="100%" stop-color="#0a090d"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="purpleGlow" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgAnne)"/>
  <circle cx="480" cy="190" r="280" fill="url(#purpleGlow)"/>

  <!-- Top Bar -->
  <rect x="0" y="0" width="800" height="42" fill="#000000" fill-opacity="0.85"/>
  <line x1="0" y1="42" x2="800" y2="42" stroke="#ffffff" stroke-opacity="0.08"/>
  <circle cx="24" cy="21" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="40" cy="21" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="56" cy="21" r="5" fill="#10b981" opacity="0.8"/>
  <rect x="220" y="10" width="360" height="22" rx="11" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="400" y="25" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10.5" text-anchor="middle">🔒 annecontemporary.art</text>

  <!-- Navbar -->
  <text x="60" y="80" fill="#ffffff" font-family="'Inter', sans-serif" font-size="17" font-weight="700" letter-spacing="3">ANNE <tspan fill="#ec4899">· ARTE</tspan></text>
  <text x="240" y="78" fill="#a1a1aa" font-family="'Inter', sans-serif" font-size="11">ACERVO</text>
  <text x="330" y="78" fill="#a1a1aa" font-family="'Inter', sans-serif" font-size="11">EXPOSIÇÕES</text>
  <text x="440" y="78" fill="#a1a1aa" font-family="'Inter', sans-serif" font-size="11">BIOGRAFIA</text>
  <rect x="640" y="62" width="100" height="28" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.2"/>
  <text x="690" y="80" fill="#ffffff" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">CONTATO</text>

  <!-- Hero Content -->
  <g transform="translate(60, 130)">
    <rect x="0" y="0" width="180" height="24" rx="12" fill="#a855f7" fill-opacity="0.12" stroke="#a855f7" stroke-opacity="0.4"/>
    <text x="14" y="16" fill="#d8b4fe" font-family="'Inter', sans-serif" font-size="9" font-weight="700" letter-spacing="2">GALERIA CONTEMPORÂNEA</text>

    <text x="0" y="65" fill="#ffffff" font-family="'Inter', sans-serif" font-size="36" font-weight="800" letter-spacing="-1">FORMAS, CORES E</text>
    <text x="0" y="105" fill="#f472b6" font-family="'Inter', sans-serif" font-size="36" font-weight="800" letter-spacing="-1">SENTIMENTOS OCULTOS</text>
    
    <text x="0" y="140" fill="#a1a1aa" font-family="'Inter', sans-serif" font-size="13">
      Obras originais e esculturas expostas em bienais internacionais em São Paulo, Milão e Berlim.
    </text>

    <g transform="translate(0, 170)">
      <rect x="0" y="0" width="190" height="42" rx="21" fill="url(#purpleGrad)"/>
      <text x="95" y="26" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1">CATÁLOGO 2024 ↗</text>
    </g>
  </g>

  <!-- Right frame showcase -->
  <g transform="translate(480, 125)">
    <rect x="0" y="0" width="260" height="290" rx="16" fill="#171220" stroke="#a855f7" stroke-opacity="0.3" stroke-width="1.5"/>
    <rect x="20" y="20" width="220" height="170" rx="10" fill="#0c0912"/>
    
    <!-- Abstract art canvas inside -->
    <circle cx="95" cy="100" r="45" fill="#a855f7" fill-opacity="0.6"/>
    <circle cx="150" cy="85" r="35" fill="#ec4899" fill-opacity="0.7"/>
    <path d="M 60 140 Q 130 90 200 130" stroke="#fbcfe8" stroke-width="3" fill="none"/>
    <rect x="70" y="60" width="50" height="50" rx="8" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.3"/>

    <text x="25" y="220" fill="#ffffff" font-family="'Inter', sans-serif" font-size="13" font-weight="700">"Sussurros do Horizonte"</text>
    <text x="25" y="238" fill="#c084fc" font-family="'Inter', sans-serif" font-size="10">Óleo sobre tela de linho · 180x120cm</text>
    <text x="25" y="260" fill="#a1a1aa" font-family="'Inter', sans-serif" font-size="9">Coleção Privada · Obra Premiada</text>
  </g>
</svg>
