<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLari" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040b10"/>
      <stop offset="60%" stop-color="#091720"/>
      <stop offset="100%" stop-color="#03080c"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgLari)"/>
  <circle cx="480" cy="190" r="280" fill="url(#cyanGlow)"/>

  <!-- Top Bar -->
  <rect x="0" y="0" width="800" height="42" fill="#000000" fill-opacity="0.85"/>
  <line x1="0" y1="42" x2="800" y2="42" stroke="#ffffff" stroke-opacity="0.08"/>
  <circle cx="24" cy="21" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="40" cy="21" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="56" cy="21" r="5" fill="#10b981" opacity="0.8"/>
  <rect x="220" y="10" width="360" height="22" rx="11" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="400" y="25" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10.5" text-anchor="middle">🔒 larissamadanatum.com.br</text>

  <!-- Navbar -->
  <text x="60" y="80" fill="#ffffff" font-family="'Inter', sans-serif" font-size="16" font-weight="800" letter-spacing="2">LARISSA <tspan fill="#38bdf8">MADANATUM</tspan></text>
  <text x="260" y="78" fill="#a1a1aa" font-family="'Inter', sans-serif" font-size="11">CONSULTORIA</text>
  <text x="370" y="78" fill="#a1a1aa" font-family="'Inter', sans-serif" font-size="11">MÉTODO</text>
  <text x="450" y="78" fill="#a1a1aa" font-family="'Inter', sans-serif" font-size="11">DEPOIMENTOS</text>
  <rect x="630" y="62" width="110" height="28" rx="14" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" stroke-width="1"/>
  <text x="685" y="80" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">AGENDAR</text>

  <!-- Hero Content -->
  <g transform="translate(60, 130)">
    <rect x="0" y="0" width="220" height="24" rx="12" fill="#06b6d4" fill-opacity="0.12" stroke="#06b6d4" stroke-opacity="0.4"/>
    <text x="14" y="16" fill="#67e8f9" font-family="'Inter', sans-serif" font-size="9" font-weight="700" letter-spacing="1">GESTÃO &amp; ALTA PERFORMANCE</text>

    <text x="0" y="65" fill="#ffffff" font-family="'Inter', sans-serif" font-size="34" font-weight="900" letter-spacing="-1">ESTRATÉGIAS DE</text>
    <text x="0" y="105" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="34" font-weight="900" letter-spacing="-1">POSICIONAMENTO PREMIUM</text>
    
    <text x="0" y="140" fill="#a1a1aa" font-family="'Inter', sans-serif" font-size="13">
      Mentoria executiva e consultoria de imagem e marca pessoal para líderes do setor corporativo.
    </text>

    <g transform="translate(0, 170)">
