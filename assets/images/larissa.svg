      <text x="100" y="26" fill="#04151f" font-family="'Inter', sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="0.5">AGENDAR SESSÃO ↗</text>
    </g>
  </g>

  <!-- Right frame showcase -->
  <g transform="translate(490, 125)">
    <rect x="0" y="0" width="250" height="290" rx="16" fill="#0c1822" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5"/>
    <rect x="20" y="20" width="210" height="150" rx="10" fill="#061017"/>

    <!-- Graph and stats -->
    <path d="M 35 130 L 80 100 L 130 115 L 195 65" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="195" cy="65" r="4.5" fill="#ffffff"/>
    <text x="35" y="45" fill="#67e8f9" font-family="'Inter', sans-serif" font-size="10" font-weight="700">+340% VALUATION DE MARCA</text>
    <text x="35" y="60" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="8.5">Indicador de percepção de autoridade</text>

    <!-- Mini boxes -->
    <rect x="20" y="185" width="100" height="42" rx="6" fill="#132635"/>
    <text x="30" y="205" fill="#38bdf8" font-size="14" font-weight="800">+120</text>
    <text x="30" y="220" fill="#94a3b8" font-size="8">Líderes Mentoradas</text>

    <rect x="130" y="185" width="100" height="42" rx="6" fill="#132635"/>
    <text x="140" y="205" fill="#38bdf8" font-size="14" font-weight="800">98%</text>
    <text x="140" y="220" fill="#94a3b8" font-size="8">Índice de Retenção</text>

    <rect x="20" y="238" width="210" height="32" rx="6" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-opacity="0.3"/>
    <text x="125" y="258" fill="#bae6fd" font-family="'Inter', sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">Exclusivo para CEOs e Diretoras</text>
