<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050e0a"/>
      <stop offset="50%" stop-color="#04180f"/>
      <stop offset="100%" stop-color="#020805"/>
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="neonRadial" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurFilter">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  <circle cx="400" cy="180" r="220" fill="url(#neonRadial)"/>

  <!-- Subtle grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
  </g>

  <!-- Browser Top Bar -->
  <rect x="0" y="0" width="800" height="42" fill="#000000" fill-opacity="0.85"/>
  <line x1="0" y1="42" x2="800" y2="42" stroke="#ffffff" stroke-opacity="0.08"/>
  <circle cx="24" cy="21" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="40" cy="21" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="56" cy="21" r="5" fill="#10b981" opacity="0.8"/>
  
  <rect x="180" y="10" width="440" height="22" rx="11" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="400" y="25" fill="#94a3b8" font-family="'Inter', -apple-system, sans-serif" font-size="10.5" text-anchor="middle" font-weight="500">🔒 focofit.com.br/desafio-21-dias</text>

  <!-- Navbar -->
  <text x="60" y="80" fill="#ffffff" font-family="'Inter', sans-serif" font-size="18" font-weight="800" letter-spacing="-0.5">FOCO<tspan fill="#10b981">FIT</tspan></text>
  <text x="180" y="78" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" font-weight="500">Metodologia</text>
  <text x="270" y="78" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" font-weight="500">Depoimentos</text>
  <text x="360" y="78" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" font-weight="500">Garantia</text>
  <rect x="630" y="62" width="110" height="28" rx="14" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1"/>
  <text x="685" y="80" fill="#34d399" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">INSCREVA-SE</text>

  <!-- Hero Content -->
  <g transform="translate(60, 130)">
    <!-- Badge -->
    <rect x="0" y="0" width="220" height="24" rx="12" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.4"/>
    <circle cx="14" cy="12" r="3.5" fill="#34d399"/>
    <text x="28" y="16" fill="#a7f3d0" font-family="'Inter', sans-serif" font-size="9" font-weight="700" letter-spacing="1">DESAFIO FOCOFIT · 21 DIAS</text>

    <!-- Main Title -->
    <text x="0" y="65" fill="#ffffff" font-family="'Inter', sans-serif" font-size="34" font-weight="900" letter-spacing="-1">
      21 DIAS PARA DESTRAVAR
    </text>
    <text x="0" y="105" fill="#34d399" font-family="'Inter', sans-serif" font-size="34" font-weight="900" letter-spacing="-1">
      SEU CORPO E DEFINIR
    </text>

    <!-- Subtitle -->
    <text x="0" y="140" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13" font-weight="400">
      Treinos rápidos de 20 minutos por dia, sem academia e com resultados reais.
    </text>

    <!-- CTA Button -->
    <g transform="translate(0, 170)">
      <rect x="0" y="0" width="200" height="44" rx="22" fill="url(#greenGlow)"/>
      <text x="100" y="27" fill="#041a0f" font-family="'Inter', sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="0.5">QUERO ENTRAR HOJE ↗</text>
    </g>

    <!-- Social Proof Badge -->
    <g transform="translate(225, 172)">
      <circle cx="16" cy="20" r="14" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
      <text x="16" y="24" fill="#34d399" font-size="10" font-weight="800" text-anchor="middle">★</text>
      <circle cx="36" cy="20" r="14" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
      <text x="36" y="24" fill="#34d399" font-size="10" font-weight="800" text-anchor="middle">★</text>
      <circle cx="56" cy="20" r="14" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
      <text x="56" y="24" fill="#34d399" font-size="10" font-weight="800" text-anchor="middle">★</text>
      <text x="82" y="17" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11" font-weight="700">+4.890 alunas</text>
      <text x="82" y="30" fill="#64748b" font-family="'Inter', sans-serif" font-size="9.5" font-weight="500">Avaliação 4.9/5 estrelas</text>
    </g>
  </g>

  <!-- Right Visual / Mockup Card -->
  <g transform="translate(520, 130)">
    <rect x="0" y="0" width="220" height="280" rx="16" fill="#0f1f17" fill-opacity="0.8" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5"/>
    <rect x="15" y="15" width="190" height="130" rx="10" fill="#04140c"/>
    <!-- Graphic silhouette / workout graph -->
    <path d="M 30 110 Q 70 60 110 85 T 180 45" fill="none" stroke="#34d399" stroke-width="3"/>
    <circle cx="180" cy="45" r="5" fill="#ffffff"/>
    <text x="25" y="40" fill="#34d399" font-family="'Inter', sans-serif" font-size="10" font-weight="700">DESEMPENHO +74%</text>
    <text x="25" y="55" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="8.5">Queima calórica acelerada</text>

    <!-- Mini stat cards -->
    <rect x="15" y="160" width="88" height="50" rx="8" fill="#162e22" stroke="#10b981" stroke-opacity="0.2"/>
    <text x="25" y="180" fill="#6ee7b7" font-size="14" font-weight="800">21 Dias</text>
    <text x="25" y="196" fill="#94a3b8" font-size="8.5">Duração do ciclo</text>

    <rect x="117" y="160" width="88" height="50" rx="8" fill="#162e22" stroke="#10b981" stroke-opacity="0.2"/>
    <text x="127" y="180" fill="#34d399" font-size="14" font-weight="800">-4.2 kg</text>
    <text x="127" y="196" fill="#94a3b8" font-size="8.5">Média relatada</text>

    <rect x="15" y="222" width="190" height="38" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.5"/>
    <text x="110" y="246" fill="#a7f3d0" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">VAGAS LIMITADAS POR TURMA</text>
  </g>
</svg>
