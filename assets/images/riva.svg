<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgRiva" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0704"/>
      <stop offset="60%" stop-color="#180e07"/>
      <stop offset="100%" stop-color="#060301"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <radialGradient id="orangeGlow" cx="60%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgRiva)"/>
  <circle cx="500" cy="180" r="280" fill="url(#orangeGlow)"/>

  <!-- Top Bar -->
  <rect x="0" y="0" width="800" height="42" fill="#000000" fill-opacity="0.9"/>
  <line x1="0" y1="42" x2="800" y2="42" stroke="#ffffff" stroke-opacity="0.08"/>
  <circle cx="24" cy="21" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="40" cy="21" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="56" cy="21" r="5" fill="#10b981" opacity="0.8"/>
  <rect x="220" y="10" width="360" height="22" rx="11" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="400" y="25" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10.5" text-anchor="middle">🔒 rivafilms.co/producoes</text>

  <!-- Navbar -->
  <text x="60" y="80" fill="#ffffff" font-family="'Inter', sans-serif" font-size="18" font-weight="900" letter-spacing="1">RIVA<tspan fill="#f97316">FILMS</tspan></text>
  <text x="220" y="78" fill="#a1a1aa" font-family="'Inter', sans-serif" font-size="11">FILMES</text>
  <text x="310" y="78" fill="#a1a1aa" font-family="'Inter', sans-serif" font-size="11">ESTÚDIO</text>
  <text x="400" y="78" fill="#a1a1aa" font-family="'Inter', sans-serif" font-size="11">CLIENTES</text>
  <rect x="640" y="62" width="100" height="28" rx="6" fill="#f97316" fill-opacity="0.15" stroke="#f97316" stroke-width="1"/>
  <text x="690" y="80" fill="#fb923c" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">CONTATO</text>

  <!-- Content -->
  <g transform="translate(60, 130)">
    <rect x="0" y="0" width="200" height="24" rx="12" fill="#ea580c" fill-opacity="0.15" stroke="#ea580c" stroke-opacity="0.4"/>
    <text x="14" y="16" fill="#fdba74" font-family="'Inter', sans-serif" font-size="9" font-weight="700" letter-spacing="1">PRODUÇÃO AUDIOVISUAL GLOBAL</text>

    <text x="0" y="65" fill="#ffffff" font-family="'Inter', sans-serif" font-size="36" font-weight="900" letter-spacing="-1">PRODUÇÕES DE CINEMA</text>
    <text x="0" y="105" fill="#f97316" font-family="'Inter', sans-serif" font-size="36" font-weight="900" letter-spacing="-1">PARA O MERCADO PUBLICITÁRIO</text>

    <text x="0" y="140" fill="#a1a1aa" font-family="'Inter', sans-serif" font-size="13">
      Criamos comerciais de TV, campanhas digitais e conteúdo de marca com padrão internacional.
    </text>

    <g transform="translate(0, 170)">
      <rect x="0" y="0" width="190" height="42" rx="8" fill="url(#orangeGrad)"/>
      <text x="95" y="26" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1">EXPLORAR PROJETOS ↗</text>
    </g>
  </g>

  <!-- Right frame showcase -->
  <g transform="translate(500, 125)">
    <rect x="0" y="0" width="240" height="280" rx="14" fill="#140a04" stroke="#f97316" stroke-opacity="0.3" stroke-width="1.5"/>
    <!-- Film strips on sides -->
    <rect x="15" y="15" width="210" height="150" rx="8" fill="#1f0f06"/>
    <!-- Central flame/action graphic -->
    <circle cx="120" cy="90" r="32" fill="#f97316" fill-opacity="0.2" stroke="#f97316"/>
    <polygon points="114,78 132,90 114,102" fill="#ffedd5"/>
    <text x="120" y="140" fill="#fdba74" font-family="'Inter', sans-serif" font-size="9" font-weight="700" text-anchor="middle">CAMPANHA DE LANÇAMENTO</text>

    <text x="20" y="195" fill="#ffffff" font-family="'Inter', sans-serif" font-size="13" font-weight="700">Comercial BMW Série 4</text>
    <text x="20" y="215" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="10">Dir. de Arte: Gabriel Riva</text>
    
    <rect x="20" y="235" width="200" height="28" rx="6" fill="#f97316" fill-opacity="0.1" stroke="#f97316" stroke-opacity="0.3"/>
    <text x="120" y="253" fill="#f97316" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Mais de 12M de visualizações</text>
  </g>
</svg>
