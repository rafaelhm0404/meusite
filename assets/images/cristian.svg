<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="60%" stop-color="#121016"/>
      <stop offset="100%" stop-color="#070609"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="amberGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad2)"/>
  <circle cx="450" cy="200" r="260" fill="url(#amberGlow)"/>

  <!-- Top Bar -->
  <rect x="0" y="0" width="800" height="42" fill="#000000" fill-opacity="0.85"/>
  <line x1="0" y1="42" x2="800" y2="42" stroke="#ffffff" stroke-opacity="0.08"/>
  <circle cx="24" cy="21" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="40" cy="21" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="56" cy="21" r="5" fill="#10b981" opacity="0.8"/>
  <rect x="220" y="10" width="360" height="22" rx="11" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="400" y="25" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10.5" text-anchor="middle">🔒 cristianfilmmaker.com</text>

  <!-- Navbar -->
  <text x="60" y="80" fill="#ffffff" font-family="'Inter', sans-serif" font-size="16" font-weight="800" letter-spacing="2">CRISTIAN<tspan fill="#f59e0b">.FILMS</tspan></text>
  <text x="240" y="78" fill="#a1a1aa" font-family="'Inter', sans-serif" font-size="11">SHOWREEL</text>
  <text x="340" y="78" fill="#a1a1aa" font-family="'Inter', sans-serif" font-size="11">COMERCIAIS</text>
  <text x="450" y="78" fill="#a1a1aa" font-family="'Inter', sans-serif" font-size="11">PREMIAÇÕES</text>
  <rect x="640" y="62" width="100" height="28" rx="6" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.2"/>
  <text x="690" y="80" fill="#ffffff" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">BOOKING</text>

  <!-- Hero Content -->
  <g transform="translate(60, 130)">
    <rect x="0" y="0" width="190" height="24" rx="4" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.4"/>
    <text x="14" y="16" fill="#fbbf24" font-family="'Inter', sans-serif" font-size="9" font-weight="700" letter-spacing="2">DIREÇÃO &amp; CINEMATOGRAFIA</text>

    <text x="0" y="65" fill="#ffffff" font-family="'Inter', sans-serif" font-size="36" font-weight="900" letter-spacing="-1">NARRATIVAS VISUAIS</text>
    <text x="0" y="105" fill="#fbbf24" font-family="'Inter', sans-serif" font-size="36" font-weight="900" letter-spacing="-1">QUE MARCAM ÉPOCAS</text>
    
    <text x="0" y="140" fill="#a1a1aa" font-family="'Inter', sans-serif" font-size="13">
      Diretor de fotografia e filmmaker para marcas globais, videoclipes e campanhas autorais.
    </text>

    <!-- CTA & Play reel -->
    <g transform="translate(0, 170)">
      <rect x="0" y="0" width="180" height="42" rx="6" fill="url(#goldGrad)"/>
      <text x="90" y="26" fill="#000000" font-family="'Inter', sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1">VER SHOWREEL 2024</text>
    </g>

    <g transform="translate(205, 170)">
      <circle cx="21" cy="21" r="21" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.2"/>
      <polygon points="18,14 28,21 18,28" fill="#ffffff"/>
      <text x="54" y="26" fill="#e4e4e7" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Assista 1:45min</text>
    </g>
  </g>

  <!-- Big Cinema Frame right -->
  <g transform="translate(480, 125)">
    <rect x="0" y="0" width="260" height="290" rx="12" fill="#0c0a10" stroke="#f59e0b" stroke-opacity="0.25" stroke-width="1.5"/>
    <!-- Viewfinder indicators -->
    <path d="M 20 30 L 20 20 L 30 20" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <path d="M 240 30 L 240 20 L 230 20" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <path d="M 20 250 L 20 260 L 30 260" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <path d="M 240 250 L 240 260 L 230 260" fill="none" stroke="#f59e0b" stroke-width="2"/>

    <!-- Inner cinema preview -->
    <rect x="25" y="40" width="210" height="150" rx="6" fill="#181420"/>
    <circle cx="130" cy="115" r="28" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1.5"/>
    <polygon points="124,103 140,115 124,127" fill="#fbbf24"/>
    <text x="130" y="160" fill="#a1a1aa" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">4K UHD · RED DIGITAL CINEMA</text>

    <!-- Bottom credits -->
    <text x="30" y="215" fill="#ffffff" font-family="'Inter', sans-serif" font-size="12" font-weight="700">CANOAS FILM FESTIVAL</text>
    <text x="30" y="232" fill="#f59e0b" font-family="'Inter', sans-serif" font-size="9" font-weight="600">★ MELHOR FOTOGRAFIA 2023</text>
    <text x="30" y="250" fill="#71717a" font-family="'Inter', sans-serif" font-size="9">CLIENTES: NIKE, PORSCHE, SONY</text>
  </g>
</svg>
